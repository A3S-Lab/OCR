[package]
name = "a3s-use-ocr"
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/A3S-Lab/OCR"
homepage = "https://github.com/A3S-Lab/OCR"
authors = ["A3S Lab"]
rust-version = "1.82"
description = "Local PP-OCRv6 optical character recognition for A3S"
readme = "README.md"
keywords = ["ocr", "onnx", "pp-ocrv6", "a3s"]
categories = ["computer-vision", "multimedia::images"]

[lib]
name = "a3s_use_ocr"
path = "src/lib.rs"

[[bin]]
name = "a3s-use-ocr"
path = "src/main.rs"

[dependencies]
a3s-use-core = "0.2.0"
clap = { version = "4", features = ["derive"] }
clipper2 = { version = "=0.5.3", default-features = false }
fs2 = "0.4"
image = { version = "=0.25.5", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
imageproc = { version = "=0.25.0", default-features = false }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["copy-dylibs", "download-binaries", "ndarray", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "=0.8.5", default-features = false, features = ["base64", "macros", "server", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "process", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
