name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the embedded inference dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          ppocr_tree="${RUNNER_TEMP}/ppocr-tree.txt"
          unlimited_tree="${RUNNER_TEMP}/unlimited-tree.txt"
          cargo tree --no-default-features --features ppocr-v6 -e features > "${ppocr_tree}"
          ! grep -E '(^| )ort(-sys)? v|chromiumoxide|a3s-power feature "server"|axum v' "${ppocr_tree}"
          cargo tree --no-default-features --features unlimited-ocr -e features > "${unlimited_tree}"
          ! grep -E '(^| )ort(-sys)? v|chromiumoxide|a3s-power feature "server"|axum v|reqwest v|hyper v' "${unlimited_tree}"

  official-ppocr-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Execute the pinned official PP-OCRv6 graphs on CPU
        shell: bash
        run: tools/check_official_ppocr_v6.sh "${RUNNER_TEMP}/official-ppocr-v6"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --no-default-features --lib --locked
      - run: cargo check --no-default-features --features mcp --locked
      - run: cargo test --features unlimited-ocr --locked
      - run: cargo clippy --all-targets --features unlimited-ocr --locked -- -D warnings
      - if: runner.os == 'macOS'
        run: cargo check --no-default-features --features unlimited-ocr-metal --locked
      - run: cargo package --locked
